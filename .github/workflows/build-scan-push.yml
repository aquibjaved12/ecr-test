name: Build, Scan, Push to ECR, and Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ECR_REPOSITORY: testpoc-app
  CONTAINER_NAME: testpoc
  # Set to HIGH to also block on high-severity findings
  FAIL_ON_SEVERITY: CRITICAL

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build → Inspector Scan → Push to ECR
  # ─────────────────────────────────────────────
  build-scan-push:
    name: Build → Inspector Scan → Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Install AWS Inspector SBOM Generator
        run: |
          curl -Lo inspector-sbomgen \
            https://amazon-inspector-sbomgen.s3.amazonaws.com/latest/linux/amd64/inspector-sbomgen
          chmod +x inspector-sbomgen

      - name: Generate SBOM from Docker image
        run: |
          ./inspector-sbomgen container \
            --image ${{ steps.build.outputs.image }} \
            --output sbom.json

      - name: Scan SBOM with AWS Inspector
        id: scan
        run: |
          aws inspector-scan scan-sbom \
            --sbom file://sbom.json \
            --output-format CYCLONE_DX_1_5 \
            > scan-results.json

          CRITICAL=$(jq '[.sbom.vulnerabilities[]? | select(.ratings[]?.severity == "critical")] | length' scan-results.json)
          HIGH=$(jq '[.sbom.vulnerabilities[]? | select(.ratings[]?.severity == "high")] | length' scan-results.json)
          MEDIUM=$(jq '[.sbom.vulnerabilities[]? | select(.ratings[]?.severity == "medium")] | length' scan-results.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH"         >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM"     >> $GITHUB_OUTPUT

          {
            echo "### AWS Inspector Scan Results"
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | $CRITICAL |"
            echo "| High     | $HIGH |"
            echo "| Medium   | $MEDIUM |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload scan results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspector-scan-results-${{ github.sha }}
          path: scan-results.json
          retention-days: 30

      - name: Enforce vulnerability gate
        run: |
          CRITICAL=${{ steps.scan.outputs.critical }}
          HIGH=${{ steps.scan.outputs.high }}

          if [ "$FAIL_ON_SEVERITY" = "CRITICAL" ] && [ "$CRITICAL" -gt 0 ]; then
            echo "BLOCKED: $CRITICAL critical vulnerabilities found. Fix before pushing to ECR."
            exit 1
          fi

          if [ "$FAIL_ON_SEVERITY" = "HIGH" ] && ( [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] ); then
            echo "BLOCKED: $CRITICAL critical, $HIGH high vulnerabilities found. Fix before pushing to ECR."
            exit 1
          fi

          echo "Vulnerability gate passed — proceeding to push."

      # Only runs on merges to main, not on pull requests
      - name: Push image to ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ${{ steps.build.outputs.image }} "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push ${{ steps.build.outputs.image }}
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "Pushed: ${{ steps.build.outputs.image }}"

  # ─────────────────────────────────────────────
  # Job 2: Deploy to EC2 via AWS SSM
  # Runs only on main branch, after a successful push to ECR
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send deploy command via SSM
        id: ssm
        env:
          IMAGE:       ${{ needs.build-scan-push.outputs.image }}
          REGISTRY:    ${{ needs.build-scan-push.outputs.registry }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGION:      ${{ secrets.AWS_REGION }}
        run: |
          # Build the SSM command payload using jq so special characters are safely escaped
          COMMANDS=$(jq -n \
            --arg region    "$REGION" \
            --arg image     "$IMAGE" \
            --arg registry  "$REGISTRY" \
            --arg container "$CONTAINER_NAME" \
            '{
              commands: [
                "set -e",
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                ("docker pull " + $image),
                ("docker stop " + $container + " 2>/dev/null || true"),
                ("docker rm "   + $container + " 2>/dev/null || true"),
                ("docker run -d --name " + $container + " -p 80:80 --restart unless-stopped " + $image),
                "docker image prune -f",
                ("echo 'Running container:' && docker ps --filter name=" + $container + " --format '{{.Names}} {{.Status}}'")
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $CONTAINER_NAME ${{ github.sha }}" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment to complete
        env:
          COMMAND_ID:  ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # Poll for up to 2 minutes (24 × 5s)
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id  "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                echo "--- stdout ---"
                aws ssm get-command-invocation \
                  --command-id  "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" --output text
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id  "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                echo "Deployment failed with status: $STATUS"
                exit 1 ;;
            esac

            if [ "$i" -eq 24 ]; then
              echo "Timed out waiting for deployment."
              exit 1
            fi
          done

      - name: Show deployment output
        if: always()
        env:
          COMMAND_ID:  ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          aws ssm get-command-invocation \
            --command-id  "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent}" \
            --output table
